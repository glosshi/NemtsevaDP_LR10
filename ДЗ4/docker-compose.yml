services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_NAME: mydb
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mydb
      MARIADB_USER: myuser
      MARIADB_PASSWORD: mypassword
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

admin:
  image: phpmyadmin/phpmyadmin
  platform: linux/amd64
  restart: unless-stopped
  environment:
    PMA_HOST: db
    PMA_USER: myuser
    PMA_PASSWORD: mypassword
  ports:
    - "8080:80"
  depends_on:
    - db
